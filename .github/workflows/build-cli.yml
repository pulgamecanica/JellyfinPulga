name: Build CLI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p artifact
          cp target/release/jellyfin-pulga artifact/
          cp config.example.toml artifact/
          cp -r static artifact/
          tar czf jellyfin-pulga-linux-x86_64.tar.gz -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-pulga-linux-x86_64
          path: jellyfin-pulga-linux-x86_64.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jellyfin-pulga-linux-x86_64.tar.gz
          generate_release_notes: true
