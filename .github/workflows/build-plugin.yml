name: Build Plugin

on:
  push:
    tags:
      - 'plugin-v*'
  pull_request:
    paths:
      - 'plugin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build plugin
        run: dotnet build plugin/JellyfinPulga/JellyfinPulga.csproj -c Release

      - name: Package plugin
        run: |
          mkdir -p artifact
          cp plugin/JellyfinPulga/bin/Release/net9.0/JellyfinPulga.dll artifact/
          cp plugin/JellyfinPulga/meta.json artifact/
          cd artifact && zip ../jellyfin-pulga-plugin.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-pulga-plugin
          path: jellyfin-pulga-plugin.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: jellyfin-pulga-plugin.zip
          generate_release_notes: true
